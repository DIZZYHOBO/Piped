###########################################################
# Piped backend configuration
# Generated by the YunoHost installer — managed by upgrade.
###########################################################

# Listen on the YunoHost-allocated port, loopback only (nginx fronts it).
PORT:__PORT_BACKEND__
HTTP_WORKERS:2

# Public URLs used in API responses and feeds.
FRONTEND_URL:__FRONTEND_URL__
API_URL:__FRONTEND_URL__/api
PROXY_PART:__PROXY_URL__

# Operational toggles.
COMPROMISED_PASSWORD_CHECK:true
DISABLE_REGISTRATION:__DISABLE_REGISTRATION__
DISABLE_TIMERS:false
FEED_RETENTION:30
SUBSCRIPTIONS_EXPIRY:30

# hCaptcha — disabled by default. Set both keys to enable.
# HCAPTCHA_SITE_KEY:
# HCAPTCHA_SECRET_KEY:

# JWT secret for user-account features. Replace if you ever leak it.
JWT_SECRET:__JWT_SECRET__

# Email contact published in feeds for content abuse handling.
ABUSE_EMAIL:__ADMIN_EMAIL__

# Database (PostgreSQL, provisioned by YunoHost).
hibernate.connection.url:jdbc:postgresql://localhost:5432/__DB_NAME__
hibernate.connection.driver_class:org.postgresql.Driver
hibernate.dialect:org.hibernate.dialect.PostgreSQLDialect
hibernate.connection.username:__DB_USER__
hibernate.connection.password:__DB_PWD__

# RYD (Return YouTube Dislike) — keep on, harmless.
GET_COMMENTS:true
SHOW_PEERTUBE:true

# Matrix federation off by default — uncomment and set if you join the Piped federation.
# MATRIX_SERVER:https://matrix-client.matrix.org
# MATRIX_TOKEN:
