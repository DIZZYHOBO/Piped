# Piped — single-domain reverse proxy.
# /        -> static frontend (built SPA)
# /api/    -> piped-backend (Java) on 127.0.0.1:__PORT_BACKEND__
# /proxy/  -> piped-proxy (Rust) on 127.0.0.1:__PORT_PROXY__

location / {
    alias __INSTALL_DIR__/dist/;
    index index.html;
    try_files $uri $uri/ /index.html;

    # Long-lived cache for hashed Vite assets, short cache for the shell.
    location ~* /assets/.*\.(js|css|woff2?|svg|png|jpg|gif|ico)$ {
        alias __INSTALL_DIR__/dist/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker should never be cached.
    location = /sw.js {
        alias __INSTALL_DIR__/dist/sw.js;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Include SSOWat config (allows YunoHost to apply public/private gating).
    more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
}

location /api/ {
    # Strip the /api prefix before forwarding to the backend.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:__PORT_BACKEND__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Backend can be slow on cold start.
    proxy_connect_timeout 30s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # Permissive CORS — Piped frontends call the API directly from the browser.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS, DELETE, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    if ($request_method = OPTIONS) {
        return 204;
    }
}

location /proxy/ {
    # Strip the /proxy prefix before forwarding.
    rewrite ^/proxy/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:__PORT_PROXY__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;

    # Media streaming: large bodies, long timeouts.
    proxy_connect_timeout 30s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    client_max_body_size  0;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
}
